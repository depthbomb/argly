name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Select virtual environment
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi
      - run: python -m pip install -e ".[dev]"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          from os import environ
          from pathlib import Path
          from tomllib import loads

          version = loads(Path('pyproject.toml').read_text())['project']['version']
          tag = environ.get('RELEASE_TAG', '')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Release tag {tag!r} does not match version {version!r}')
          print(f'Checking argly {version}')
          PY
      - run: python -m ruff check .
      - run: python -m mypy
      - name: Check prepared example artifacts
        run: python -m argly gen --prepared --package examples.remote_cli.commands --name tool --windows-options --output examples/remote_cli/generated.py --check
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Confirm imports come from the installed wheel
        run: |
          python -I - <<'PY'
          import argly
          from sys import prefix
          from pathlib import Path

          if not Path(argly.__file__).resolve().is_relative_to(Path(prefix).resolve()):
              raise SystemExit(f'Imported checkout instead of installed wheel: {argly.__file__}')
          print(argly.__file__)
          PY
      - name: Test the installed wheel with coverage
        run: |
          test_dir=$(mktemp -d)
          cp -R tests examples "$test_dir/"
          cp pyproject.toml "$test_dir/"
          cd "$test_dir"
          python -m pytest --import-mode=importlib --cov=argly --cov-branch
      - run: python -m pip check
      - name: Save validated distributions
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
