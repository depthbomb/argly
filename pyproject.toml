[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argly"
version = "0.1.0"
description = "A fast, module-oriented command-line framework with lazy handlers."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
authors = [{ name = "depthbomb" }]
keywords = ["cli", "command-line", "parser", "arguments", "lazy-loading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://github.com/depthbomb/argly#readme"
Source = "https://github.com/depthbomb/argly"
Issues = "https://github.com/depthbomb/argly/issues"
Releases = "https://github.com/depthbomb/argly/releases"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.11",
    "twine>=6",
]
cython = ["Cython>=3.1", "setuptools>=77", "wheel>=0.45"]

[project.scripts]
argly = "argly.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["argly", "argly.*"]

[tool.setuptools.package-data]
argly = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["UP045"]

[tool.ruff.lint.per-file-ignores]
"examples/remote_cli/generated.py" = ["ALL"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"
exclude = ["examples/remote_cli/generated.py"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["argly"]
